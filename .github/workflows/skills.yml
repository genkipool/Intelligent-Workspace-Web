name: Skills Validation

on:
    push:
        branches: [main, develop]
        paths:
            - 'SKILL.md'
            - 'skills/**'
            - 'skills.sh.json'
            - 'scripts/check-skills.mjs'
            - '.github/workflows/skills.yml'
    pull_request:
        branches: [main, develop]
        paths:
            - 'SKILL.md'
            - 'skills/**'
            - 'skills.sh.json'
            - 'scripts/check-skills.mjs'
            - '.github/workflows/skills.yml'
    workflow_dispatch:

concurrency:
    group: skills-${{ github.ref }}
    cancel-in-progress: true

jobs:
    validate-skills:
        name: Validate Agent Skills & skills.sh Manifest
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 24

            - name: Validate local Skill definition and manifest
              run: node scripts/check-skills.mjs
